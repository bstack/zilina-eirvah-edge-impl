apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: uns-auto-contextualizer
  namespace: eirvah-e1
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: uns-auto-contextualizer}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - {type: Pods, value: 1, periodSeconds: 30}
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - {type: Pods, value: 1, periodSeconds: 30}
