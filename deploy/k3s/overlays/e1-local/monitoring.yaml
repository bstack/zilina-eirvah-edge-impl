apiVersion: v1
kind: ServiceAccount
metadata:
  name: e1-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e1-prometheus
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e1-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e1-prometheus
subjects:
- kind: ServiceAccount
  name: e1-prometheus
  namespace: eirvah-e1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: e1-prometheus
data:
  prometheus.yml: "global:\n  scrape_interval: 2s\nscrape_configs:\n- job_name: e1-pods\n\
    \  kubernetes_sd_configs:\n  - role: pod\n    namespaces:\n      names:\n    \
    \  - eirvah-e1\n  relabel_configs:\n  - source_labels:\n    - __meta_kubernetes_pod_annotation_eirvah_uniza_scrape\n\
    \    action: keep\n    regex: 'true'\n  - source_labels:\n    - __address__\n\
    \    regex: ([^:]+)(?::[0-9]+)?\n    replacement: $1:8080\n    target_label: __address__\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_name\n    target_label: pod\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_label_app_kubernetes_io_name\n\
    \    target_label: app\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e1-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e1-prometheus
  template:
    metadata:
      labels:
        app: e1-prometheus
    spec:
      serviceAccountName: e1-prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=1d
        ports:
        - name: http
          containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: e1-prometheus
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: e1-prometheus
spec:
  selector:
    app: e1-prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
