apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
---
# ClusterRole required — kube-state-metrics must list/watch namespaces
# (a cluster-scoped resource) even when --namespaces is set.
# All verbs are read-only; limited to resources used by the autoscaling dashboard.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eirvah-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eirvah-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eirvah-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: eirvah-edge
