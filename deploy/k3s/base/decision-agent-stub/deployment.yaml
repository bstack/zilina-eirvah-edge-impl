apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-agent-stub
  labels: { app.kubernetes.io/name: decision-agent-stub }
spec:
  replicas: 1
  # This decision service owns in-memory deduplication; do not overlap replacements.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels: { app.kubernetes.io/name: decision-agent-stub }
  template:
    metadata:
      labels: { app.kubernetes.io/name: decision-agent-stub }
    spec:
      containers:
        - name: decision-agent-stub
          image: decision-agent-stub:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DECISION_AGENT_STUB_MQTT_HOST
              value: mosquitto
            - name: DECISION_AGENT_STUB_MQTT_USERNAME
              value: eirvah
            - name: DECISION_AGENT_STUB_MQTT_PASSWORD
              value: eirvah-dev-password
            - name: DECISION_AGENT_STUB_AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: actuation-security
                  key: decision-amqp-url
            - name: DECISION_AGENT_STUB_SUBSCRIBE_TOPIC
              value: uniza/zilina/factory1/line_a/conveyor/belt_01/speed_setpoint
            - name: DECISION_AGENT_STUB_ENABLED
              value: "true"
            - name: DECISION_AGENT_STUB_NORMAL_SPEED_MAX
              value: "0.5"
            - name: DECISION_AGENT_STUB_HIGH_SPEED_MIN
              value: "0.6"
            - name: DECISION_AGENT_STUB_NORMAL_SETPOINT
              value: "22.0"
            - name: DECISION_AGENT_STUB_HIGH_SETPOINT
              value: "26.0"
            - name: DECISION_AGENT_STUB_INSPECTION_ENABLED
              value: "true"
          resources:
            requests: { cpu: "10m", memory: "64Mi" }
            limits:   { cpu: "100m", memory: "128Mi" }
