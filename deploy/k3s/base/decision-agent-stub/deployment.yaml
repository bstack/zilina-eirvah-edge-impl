apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-agent-stub
  labels: { app.kubernetes.io/name: decision-agent-stub }
spec:
  replicas: 1
  # This decision service owns in-memory deduplication; do not overlap replacements.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels: { app.kubernetes.io/name: decision-agent-stub }
  template:
    metadata:
      labels: { app.kubernetes.io/name: decision-agent-stub }
    spec:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: decision-agent-stub
          image: decision-agent-stub:local
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: observation-contracts
              mountPath: /etc/decision-agent-stub
              readOnly: true
            - name: recovery-state
              mountPath: /var/lib/eirvah
          env:
            - name: DECISION_AGENT_STUB_OBSERVATION_CONTRACT_PATH
              value: /etc/decision-agent-stub/eirvah-line-a.jsonld
            - name: DECISION_AGENT_STUB_INBOX_PATH
              value: /var/lib/eirvah/consumer.sqlite3
            - name: DECISION_AGENT_STUB_REQUIRE_POSITIONS
              value: "true"
            - name: DECISION_AGENT_STUB_RECEIPT_KEY
              valueFrom:
                secretKeyRef:
                  name: actuation-security
                  key: inspection-receipt-key
            - name: DECISION_AGENT_STUB_MQTT_HOST
              value: mosquitto
            - name: DECISION_AGENT_STUB_MQTT_USERNAME
              value: eirvah
            - name: DECISION_AGENT_STUB_MQTT_PASSWORD
              value: eirvah-dev-password
            - name: DECISION_AGENT_STUB_AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: actuation-security
                  key: decision-amqp-url
            - name: DECISION_AGENT_STUB_SUBSCRIBE_TOPIC
              value: uniza/zilina/factory1/line_a/conveyor/belt_01/speed_setpoint
            - name: DECISION_AGENT_STUB_ENABLED
              value: "true"
            - name: DECISION_AGENT_STUB_NORMAL_SPEED_MAX
              value: "0.5"
            - name: DECISION_AGENT_STUB_HIGH_SPEED_MIN
              value: "0.6"
            - name: DECISION_AGENT_STUB_NORMAL_SETPOINT
              value: "22.0"
            - name: DECISION_AGENT_STUB_HIGH_SETPOINT
              value: "26.0"
            - name: DECISION_AGENT_STUB_INSPECTION_ENABLED
              value: "true"
          resources:
            requests: { cpu: "10m", memory: "64Mi" }
            limits:   { cpu: "100m", memory: "128Mi" }
      volumes:
        - name: observation-contracts
          configMap:
            name: decision-observation-contracts
        - name: recovery-state
          persistentVolumeClaim:
            claimName: decision-recovery
