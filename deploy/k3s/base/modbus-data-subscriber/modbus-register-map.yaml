# Register map for modbus-data-subscriber — Filler + Conveyor + Reject Station
host: modbus-simulator
port: 5020
unit_id: 1
poll_interval_ms: 500
# One atomic 10-register inspection snapshot; no split bottle/result pairing.
inspection_address: 32
registers:
  # Filler (addresses 0–2)
  - address: 0
    alias: "Filler.FillLevelSensor01"
    scale: 10.0
    value_type: double
  - address: 1
    alias: "Filler.Motor01.State"
    scale: 1.0
    value_type: int64
  - address: 2
    alias: "Filler.ThroughputMeter01"
    scale: 100.0
    value_type: double
  # Conveyor (addresses 3–5)
  - address: 3
    alias: "Conveyor.Belt01.BeltSpeed"
    scale: 100.0
    value_type: double
  - address: 4
    alias: "Conveyor.Belt01.JamDetected"
    scale: 1.0
    value_type: int64
  - address: 5
    alias: "Conveyor.Belt01.BottleCount"
    scale: 1.0
    value_type: int64
  # Reject Station (addresses 6–7)
  - address: 6
    alias: "RejectStation.RejectCounter01"
    scale: 1.0
    value_type: int64
  - address: 7
    alias: "RejectStation.ConveyorActive01"
    scale: 1.0
    value_type: int64

  - address: 8
    alias: Filler.Valve01.Open
    scale: 1.0
    value_type: int64
  - address: 9
    alias: Conveyor.Belt01.Running
    scale: 1.0
    value_type: int64
  - address: 10
    alias: Conveyor.Belt01.SpeedSetpoint
    scale: 100.0
    value_type: double
  - address: 11
    alias: RejectStation.LastRejectedBottle
    scale: 1.0
    value_type: int64
