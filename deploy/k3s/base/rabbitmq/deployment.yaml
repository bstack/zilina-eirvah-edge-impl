apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: { app.kubernetes.io/name: rabbitmq }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          env:
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "+S 2:2 +SDcpu 1 +SDio 1"
            - name: RABBITMQ_CTL_ERL_ARGS
              value: "+S 1:1 +SDcpu 1 +SDio 1"
          ports:
            - { name: amqp,       containerPort: 5672 }
            - { name: management, containerPort: 15672 }
            - { name: prometheus, containerPort: 15692 }
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq
            - name: security
              mountPath: /run/actuation-security
              readOnly: true
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "status"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
      volumes:
        - name: security
          secret:
            secretName: actuation-security
            items:
              - { key: definitions.json, path: definitions.json }
        - name: config
          configMap:
            name: rabbitmq-config
            items:
              - { key: rabbitmq.conf,    path: rabbitmq.conf }
              - { key: enabled_plugins,  path: enabled_plugins }
