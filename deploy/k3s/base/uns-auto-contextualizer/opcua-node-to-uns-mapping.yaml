# Maps OPC UA node aliases to ISA-95 UNS paths (spec §4.1, §3.1).
# enterprise and site are injected at runtime via UNS_AUTO_CONTEXTUALIZER_ENTERPRISE / _SITE env vars.
mappings:
  - node_id: "Bottler.Temperature01"
    area: factory1
    line: line_a
    cell: bottler
    equipment: temperature_sensor_01
    measurement: temperature
    semantic_type: temperature.celsius

  - node_id: "Bottler.ThroughputMeter01"
    area: factory1
    line: line_a
    cell: bottler
    equipment: throughput_meter_01
    measurement: throughput
    semantic_type: flow.bps

  - node_id: "Bottler.Motor01.State"
    area: factory1
    line: line_a
    cell: bottler
    equipment: motor_01
    measurement: state
    semantic_type: state.enum

  - node_id: "Bottler.Motor01.Rpm"
    area: factory1
    line: line_a
    cell: bottler
    equipment: motor_01
    measurement: rpm
    semantic_type: rotational_speed.rpm

  - node_id: "Bottler.SetpointUnit.SetpointTemperature"
    area: factory1
    line: line_a
    cell: bottler
    equipment: setpoint_unit
    measurement: setpoint_temperature
    semantic_type: setpoint.target

  - node_id: "Filler.FillLevelSensor01"
    area: factory1
    line: line_a
    cell: filler
    equipment: fill_level_sensor_01
    measurement: fill_level
    semantic_type: level.percent

  - node_id: "Filler.Motor01.State"
    area: factory1
    line: line_a
    cell: filler
    equipment: motor_01
    measurement: state
    semantic_type: state.enum

  - node_id: "Filler.ThroughputMeter01"
    area: factory1
    line: line_a
    cell: filler
    equipment: throughput_meter_01
    measurement: throughput
    semantic_type: flow.bps

  # Conveyor (Modbus)
  - node_id: "Conveyor.Belt01.BeltSpeed"
    area: factory1
    line: line_a
    cell: conveyor
    equipment: belt_01
    measurement: belt_speed
    semantic_type: speed.ms

  - node_id: "Conveyor.Belt01.JamDetected"
    area: factory1
    line: line_a
    cell: conveyor
    equipment: belt_01
    measurement: jam_detected
    semantic_type: state.enum

  - node_id: "Conveyor.Belt01.BottleCount"
    area: factory1
    line: line_a
    cell: conveyor
    equipment: belt_01
    measurement: bottle_count
    semantic_type: count.cumulative

  # Reject Station (Modbus)
  - node_id: "RejectStation.RejectCounter01"
    area: factory1
    line: line_a
    cell: reject_station
    equipment: reject_counter_01
    measurement: reject_count
    semantic_type: count.cumulative

  - node_id: "RejectStation.ConveyorActive01"
    area: factory1
    line: line_a
    cell: reject_station
    equipment: conveyor_01
    measurement: conveyor_active
    semantic_type: state.enum

  # Inspector (OPC UA)
  - node_id: "Inspector.Inspector01.GoodRate"
    area: factory1
    line: line_a
    cell: inspector
    equipment: inspector_01
    measurement: good_rate
    semantic_type: quality.percent

  # Labeler (OPC UA)
  - node_id: "Labeler.Labeler01.AlignmentScore"
    area: factory1
    line: line_a
    cell: labeler
    equipment: labeler_01
    measurement: alignment_score
    semantic_type: quality.percent

  # Capper (S7)
  - node_id: "Capper.TorqueSensor01"
    area: factory1
    line: line_a
    cell: capper
    equipment: torque_sensor_01
    measurement: torque
    semantic_type: torque.nm

  - node_id: "Capper.CapSensor01"
    area: factory1
    line: line_a
    cell: capper
    equipment: cap_sensor_01
    measurement: cap_presence
    semantic_type: state.enum

  - node_id: "Capper.RejectCounter01"
    area: factory1
    line: line_a
    cell: capper
    equipment: reject_counter_01
    measurement: rejects_per_min
    semantic_type: count.rate

  # Palletizer (S7)
  - node_id: "Palletizer.LayerCounter01"
    area: factory1
    line: line_a
    cell: palletizer
    equipment: layer_counter_01
    measurement: layer_count
    semantic_type: count.cumulative

  - node_id: "Palletizer.PalletSensor01"
    area: factory1
    line: line_a
    cell: palletizer
    equipment: pallet_sensor_01
    measurement: pallet_complete
    semantic_type: state.enum

  - node_id: "Palletizer.CycleCounter01"
    area: factory1
    line: line_a
    cell: palletizer
    equipment: cycle_counter_01
    measurement: cycles_per_hr
    semantic_type: count.rate
