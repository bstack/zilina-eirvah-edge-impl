# Per-node unit and type rules for data-converter (spec §3.1).
# scale and offset are optional; absent means pass-through.
# drop_bad_quality: false — bad quality messages still flow (spec §4.2).
rules:
  - node_id: "Bottler.Temperature01"
    value_type: double
    unit: degC
    drop_bad_quality: false

  - node_id: "Bottler.ThroughputMeter01"
    value_type: double
    unit: "bottle/s"
    drop_bad_quality: false

  - node_id: "Bottler.Motor01.State"
    value_type: int64
    unit: dimensionless
    drop_bad_quality: false

  - node_id: "Bottler.Motor01.Rpm"
    value_type: double
    unit: rpm
    drop_bad_quality: false

  - node_id: "Bottler.SetpointUnit.SetpointTemperature"
    value_type: double
    unit: degC
    drop_bad_quality: false

  - node_id: Filler.Valve01.Open
    value_type: int64
    unit: dimensionless
    drop_bad_quality: false
  - node_id: Conveyor.Belt01.Running
    value_type: int64
    unit: dimensionless
    drop_bad_quality: false
  - node_id: Conveyor.Belt01.SpeedSetpoint
    value_type: double
    unit: m/s
    drop_bad_quality: false
    # Simulated conveyor contract: 0.01 m/s, half-even rounding, valid range checked first.
    # 3e-8 m/s bounds float32 representation error at 0.8 (half an ULP is ~2.98e-8).
    precision:
      resolution: 0.01
      minimum: 0.0
      maximum: 0.8
      encoding_error: 0.00000003
  - node_id: RejectStation.LastRejectedBottle
    value_type: int64
    unit: dimensionless
    drop_bad_quality: false
  - node_id: Capper.Motor01.Running
    value_type: int64
    unit: dimensionless
    drop_bad_quality: false
  - node_id: Capper.Motor01.Faulted
    value_type: int64
    unit: dimensionless
    drop_bad_quality: false
  - node_id: Capper.Motor01.SpeedSetpoint
    value_type: int64
    unit: rpm
    drop_bad_quality: false
  - node_id: Capper.Motor01.Rpm
    value_type: int64
    unit: rpm
    drop_bad_quality: false
  - node_id: Inspector01.BottleInspection
    value_type: string
    unit: json
    drop_bad_quality: true
