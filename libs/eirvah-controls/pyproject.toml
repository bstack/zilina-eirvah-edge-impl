[project]
name = "eirvah-controls"
version = "0.0.0"
description = "Deterministic simulated actuator state and device outcomes."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eirvah_controls"]
